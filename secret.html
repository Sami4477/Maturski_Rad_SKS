<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasporedi</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            padding: 20px;
            text-align: center;
            flex: 1;
        }

        h1 {
            color: #333;
        }

        .class-selector h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .class-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .class-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #333;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
            min-width: 150px;
        }

        .class-buttons button:hover {
            background-color: #0056b3;
        }

        .schedule {
            margin-top: 20px;
        }

        .schedule table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            max-width: 600px;
        }

        .schedule th, .schedule td {
            border: 1px solid #007bff;
            padding: 10px;
            text-align: left;
        }

        .schedule th {
            background-color: #007bff;
            color: white;
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #0056b3;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }

        footer a:hover {
            color: hsl(219, 59%, 58%);
        }

        footer p {
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .class-buttons {
                flex-direction: column;
            }

            .class-buttons button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Raspored</h1>

        <div class="class-selector">
            <h2>Odaberite učenika:</h2>

            <div id="class-buttons" class="class-buttons">
                <!-- Buttons will be added here by JavaScript -->
            </div>
        </div>

        <div id="class-schedule" class="schedule">
            <!-- Schedule will be displayed here -->
        </div>

        <button onclick="location.href='index.html'" class="back-button">Nazad na početnu</button>
    </div>

    <footer>
        <a href="kontakt.html">Kontakt</a>
        <a href="info.html" target="_blank">O meni</a>
        <a href="zahvala.html">Zahvala</a>
        <p>Napravio Nikola Kujundžija</p>
    </footer>

    <script>
        const students = ['Učenik 1', 'Učenik 2', 'Učenik 3', 'Učenik 4'];
        const classButtons = document.getElementById('class-buttons');
        students.forEach((student, index) => {
            const button = document.createElement('button');
            button.textContent = student;
            button.onclick = () => showSchedule(`student${index + 1}`);
            classButtons.appendChild(button);
        });

        function showSchedule(student) {
            const schedules = {
                student1: [
                    { day: "Ponedjeljak", time: "21:30", location: "SD Skenderija" },
                    { day: "Utorak", time: "20:00", location: "KSC Ilidža" },
                    { day: "Srijeda", time: "21:00", location: "dvorana KSC Otoka" },
                    { day: "Četvrtak", time: "21:30", location: "KSC Ilidža" },
                    { day: "Petak", time: "20:00", location: "KD Skenderija" }
                ],
                
            };

            const schedule = schedules[student];
            let html = '<table><tr><th>Dan</th><th>Vrijeme</th><th>Lokacija</th></tr>';
            schedule.forEach(item => {
                html += `<tr><td>${item.day}</td><td>${item.time}</td><td>${item.location}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('class-schedule').innerHTML = html;
        }
    </script>
</body>

</html>
